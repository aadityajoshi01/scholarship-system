<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholarship Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: #f5f7fb;
        font-family: Arial, sans-serif;
      }
      .container {
        max-width: 1100px;
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="mb-4">Scholarship Management Portal</h1>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card p-4 shadow-sm">
            <h3>Login</h3>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" id="loginEmail" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" id="loginPassword" required />
              </div>
              <button class="btn btn-primary" type="submit">Login</button>
            </form>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card p-4 shadow-sm">
            <h3>Register</h3>
            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" type="text" id="registerName" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" id="registerEmail" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" id="registerPassword" required />
              </div>
              <button class="btn btn-success" type="submit">Register</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/api.js"></script>
  </body>
</html>
