<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholarship Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb}.container{max-width:1100px;margin-top:32px}.card{border:0;box-shadow:0 4px 18px #172b4d12}</style></head><body><main class="container"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1>Scholarship Portal</h1><p class="text-muted mb-0">Apply, track and manage scholarship applications.</p></div><button id="logout" class="btn btn-outline-secondary d-none">Log out</button></div><div id="message" class="alert d-none"></div><section id="auth" class="row g-4"><div class="col-md-6"><div class="card p-4"><h3>Register</h3><form id="registerForm"><input id="registerName" class="form-control mb-3" placeholder="Full name" required><input id="registerEmail" type="email" class="form-control mb-3" placeholder="Email" required><input id="registerPassword" type="password" minlength="8" class="form-control mb-3" placeholder="Password (8+ characters)" required><button class="btn btn-success">Create account</button></form></div></div><div class="col-md-6"><div class="card p-4"><h3>Login</h3><form id="loginForm"><input id="loginEmail" type="email" class="form-control mb-3" placeholder="Email" required><input id="loginPassword" type="password" class="form-control mb-3" placeholder="Password" required><button class="btn btn-primary">Login</button></form></div></div></section><section id="dashboard" class="d-none"><div class="card p-4 mb-4"><h2>Welcome, <span id="userName"></span></h2><form id="applicationForm" class="row g-3"><div class="col-md-6"><label>Scholarship scheme</label><select id="schemeId" class="form-select" required></select></div><div class="col-md-6"><label>Course</label><input id="course" class="form-control" required></div><div class="col-md-6"><label>Institution</label><input id="institution" class="form-control" required></div><div class="col-md-3"><label>Annual income</label><input id="annualIncome" type="number" class="form-control" required></div><div class="col-md-3"><label>Marks (%)</label><input id="marks" type="number" min="0" max="100" class="form-control" required></div><div><button class="btn btn-primary">Submit application</button></div></form></div><div class="card p-4"><h3>My applications</h3><div class="table-responsive"><table class="table"><thead><tr><th>Number</th><th>Scheme</th><th>Status</th><th>Created</th></tr></thead><tbody id="applications"></tbody></table></div></div></section></main><script src="./js/api.js"></script></body></html>
